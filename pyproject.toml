[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prefixrouter"
version = "0.1.0"
description = "Prefix-aware routing gateway for LLM replicas: requests sharing a system prompt land on the same replica so KV cache blocks get reused"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Noman Jafar", email = "numanjafarshahzad@gmail.com" }]
dependencies = ["httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "tokenbench @ git+https://github.com/NomanJafar/tokenbench"]

[tool.hatch.build.targets.wheel]
packages = ["src/prefixrouter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.metadata]
allow-direct-references = true
